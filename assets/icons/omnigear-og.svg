<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 60" width="140" height="60" role="img" aria-label="OmniGear">
  <title>OmniGear</title>
  <!-- The O and G of the wordmark, taken from assets/omnigear-logo-black.svg:
       its solid layer only, with the three ghost layers behind it dropped
       because they close up the counters at icon size.

       Filled white, like the mouse icons beside it, because the shell tints
       these through MultiEffect colorization and that keeps the source
       luminance. A black mark stays black however it is tinted. -->
  <g fill="#ffffff">
    <rect x="0" y="10" width="60" height="10"/>
    <rect x="0" y="20" width="20" height="10"/>
    <rect x="0" y="30" width="20" height="10"/>
    <rect x="0" y="40" width="60" height="10"/>
    <rect x="10" y="0" width="40" height="10"/>
    <rect x="10" y="50" width="40" height="10"/>
    <rect x="40" y="20" width="20" height="10"/>
    <rect x="40" y="30" width="20" height="10"/>
    <rect x="70" y="20" width="20" height="10"/>
    <rect x="70" y="30" width="20" height="10"/>
    <rect x="80" y="10" width="50" height="10"/>
    <rect x="80" y="40" width="50" height="10"/>
    <rect x="90" y="0" width="40" height="10"/>
    <rect x="90" y="50" width="30" height="10"/>
    <rect x="110" y="30" width="30" height="10"/>
  </g>
</svg>
